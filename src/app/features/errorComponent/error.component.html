<div class="error">
    <div class="error__image-container">
        <img class="error__image" [src]="state.image" alt="error-image" />
    </div>
    <div class="error__text-box">
        <h1 class="error__heading mat-headline-2">{{ state.title }}</h1>
        <p class="error__paragraph mat-body-1">
            {{ state.description }}
        </p>
        <button class="error__button" mat-flat-button color="primary">
            Go back home
        </button>
    </div>
</div>
