<div class="login">
    <mat-card class="login__container">
        <div class="login__header">
            <h1 class="mat-headline-4 login__heading">Restaurant Portal</h1>

            <p class="mat-subtitle-2 login__description">
                Log in to manage orders, menus, and stats.
            </p>
        </div>

        <form
            class="login__form"
            [formGroup]="loginForm"
            (ngSubmit)="onSubmit()"
        >
            <mat-form-field class="login__input">
                <mat-label>Email Address</mat-label>

                <input
                    matInput
                    type="email"
                    placeholder="Email address"
                    formControlName="email"
                />

                <mat-error *ngIf="email?.hasError('required')">
                    Email is required
                </mat-error>

                <mat-error *ngIf="email?.hasError('email')">
                    Enter a valid email
                </mat-error>
            </mat-form-field>

            <mat-form-field class="login__input">
                <mat-label>Password</mat-label>

                <input
                    matInput
                    type="password"
                    placeholder="Password"
                    formControlName="password"
                />
                <button
                    mat-icon-button
                    matSuffix
                    (click)="hide = !hide"
                    [attr.aria-label]="'Hide password'"
                    [attr.aria-pressed]="hide"
                >
                    <mat-icon>{{
                        hide ? 'visibility_off' : 'visibility'
                    }}</mat-icon>
                </button>

                <mat-error *ngIf="password?.hasError('required')">
                    Password is required
                </mat-error>
            </mat-form-field>

            <div class="login__error" *ngIf="loginError">
                Invalid email or password
            </div>

            <app-button
                type="submit"
                label="LOGIN"
                buttonClass="test"
            ></app-button>
        </form>
    </mat-card>
</div>
