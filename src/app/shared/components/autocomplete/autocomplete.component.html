<form class="example-form">
    <mat-form-field
        class="example-full-width autocomplete"
        appearance="outline"
    >
        <mat-label>View dashboards as</mat-label>
        <input
            type="text"
            placeholder="Pick one"
            aria-label="View aashboard as"
            matInput
            [formControl]="myControl"
            [matAutocomplete]="auto"
        />
        <mat-autocomplete #auto="matAutocomplete">
            <mat-option
                *ngFor="let option of filteredOptions | async"
                [value]="option"
            >
                {{ option }}
            </mat-option>
        </mat-autocomplete>
    </mat-form-field>
</form>
